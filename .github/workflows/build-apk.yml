name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

jobs:
  build:
    name: Build RD Manager APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Install NPM Dependencies
        run: npm ci || npm install

      - name: Build Web Application
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Make Gradlew Executable
        run: chmod +x android/gradlew

      - name: Build APK (Assemble Debug)
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK for Distribution
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk ./RD-Manager-v1.0.20.apk

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RD-Manager-APK
          path: ./RD-Manager-v1.0.20.apk
          retention-days: 30

      - name: Attach APK to GitHub Release (If Tagged Release)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ./RD-Manager-v1.0.20.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
