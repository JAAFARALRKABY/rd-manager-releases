name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

jobs:
  build:
    name: Build RD Manager APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Install NPM Dependencies
        run: npm ci || npm install

      - name: Build Web Application
        run: npm run build

      - name: Make Gradlew Executable
        run: chmod +x android/gradlew

      - name: Sync Capacitor Android
        run: |
          npx @capacitor/cli sync android || true
          mkdir -p android/app/src/main/assets/public
          cp -r dist/* android/app/src/main/assets/public/
          cp capacitor.config.json android/app/src/main/assets/capacitor.config.json
          [ -f android/app/src/main/assets/capacitor.plugins.json ] || echo "[]" > android/app/src/main/assets/capacitor.plugins.json

      - name: Accept Android Licenses & Setup SDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "platforms;android-36" || true

      - name: Build APK (Assemble Debug)
        run: |
          set -o pipefail
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee ../gradle-build.log

      - name: Print Gradle Error Log If Failed
        if: failure()
        run: |
          if [ -f gradle-build.log ]; then
            echo "========== GRADLE BUILD FAILURE LOG =========="
            tail -n 120 gradle-build.log
          fi

      - name: Upload Build Log on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: ./gradle-build.log

      - name: Rename APK for Distribution
        run: |
          find android -name "*.apk"
          APK_PATH=$(find android -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "Error: No APK file found in android directory!"
            exit 1
          fi
          echo "Found APK at: $APK_PATH"
          cp "$APK_PATH" ./RD-Manager-v1.0.20.apk
          ls -lh ./RD-Manager-v1.0.20.apk

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RD-Manager-APK
          path: ./RD-Manager-v1.0.20.apk
          retention-days: 30

      - name: Attach APK to GitHub Release (If Tagged Release)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ./RD-Manager-v1.0.20.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
